[workspace]
members = ["crates/protocol", "crates/adapter", "crates/overlay"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
dd-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
    "Win32_System_Pipes", "Win32_System_IO", "Win32_System_LibraryLoader",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug", "Win32_UI_WindowsAndMessaging",
    "Win32_System_SystemInformation",
] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
strip = "debuginfo"
